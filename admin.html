<section class="pan" id="t-chats"><div class="chats"><div id="clist"></div><div id="thread" hidden><b id="tn"></b><div class="msgs" id="tmsgs" style="height:300px;border-radius:12px;margin:8px 0"></div><div class="cin" style="padding:0"><input id="rm" placeholder="Reply…"><button class="btn sm" id="rsend">Reply</button></div></div></div></section>
<section class="pan" id="t-products"><div class="two"><div><h3 id="formT">Add product</h3><div class="fgrid">
<div class="full"><label>Name</label><input id="pn"></div><div><label>Price (GH₵)</label><input id="pp" type="number" min="0" step="0.01"></div><div><label>Stock quantity</label><input id="ps" type="number" min="0" value="10"></div>
<div><label>Category</label><select id="pc"><option>Skincare</option><option>Deodorants</option></select></div><div><label>Emoji (if no photo)</label><input id="pe" value="🧴"></div>
<div><label>Rating 0–5 (optional)</label><input id="pr" type="number" min="0" max="5"></div><div class="full"><label>Description</label><textarea id="pd" rows="2"></textarea></div><div class="full"><label>Product photo</label><input type="file" id="pf" accept="image/*"></div></div>
<button class="btn" id="save">Save product</button> <button class="btn o sm" id="clr">Clear</button></div>
<div><h3>All products <small style="font-weight:400;font-size:.75rem;color:var(--mute)">(edit stock directly)</small></h3><div id="plist"></div></div></div></section>
<section class="pan" id="t-settings"><div style="max-width:460px"><h3>Store settings</h3><div class="fgrid">
<div class="full"><label>Your WhatsApp number (orders go here)</label><input id="wa" placeholder="0244123456"></div>
<div><label>MoMo number (customers pay this number if Paystack is not set up)</label><input id="mn" placeholder="0244123456"></div><div><label>MoMo account name</label><input id="mname"></div>
<div class="full"><label>MoMo network</label><select id="mnet"><option>MTN MoMo</option><option>Telecel Cash</option><option>AT Money</option></select></div>
<div class="full chk"><input type="checkbox" id="cod" checked><span>Allow pay on delivery</span></div>
<div class="full"><label>Paystack public key (optional, lets customers pay with MoMo instantly)</label><input id="pk" placeholder="pk_live_…"></div></div>
<button class="btn" id="sset">Save settings</button></div></section>
</div></div><div class="toast" id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,updateDoc,onSnapshot,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const $=s=>document.querySelector(s),cfg=window.PETAL_CONFIG;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'GH₵'+Number(n).toFixed(2);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
if(!cfg||String(cfg.apiKey).startsWith('PASTE')){document.body.innerHTML='<p style="padding:30px">Add your Firebase config to config.js first.</p>';throw new Error('no config')}
const app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app);
const waNum=s=>{s=String(s||'').replace(/\D/g,'');if(s.startsWith('00'))s=s.slice(2);if(s.startsWith('0'))s='233'+s.slice(1);else if(s.length===9)s='233'+s;return s};
const byT=(a,b)=>(a.t?.seconds||0)-(b.t?.seconds||0),er=()=>{};
const thumb=p=>p.img?`<img src="${p.img}" alt="">`:esc(p.emoji||'🧴');
const bub=(m,me)=>`<div class="mb ${me?'mine':'other'}">${esc(m.text)}</div>`;
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.3)}catch(e){}}
let un=[],P=[],O=[],curC=null,uT=null,editId=null,img='';
onAuthStateChanged(auth,u=>{const ad=!!u&&!u.isAnonymous;$('#login').hidden=ad;$('#dash').hidden=!ad;$('#out').hidden=!ad;ad?start():stop()});
$('#loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(e){toast('Wrong email or password')}};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};
$('#out').onclick=()=>signOut(auth);
function start(){if(un.length)return;let f1=true,f2=true;un=[
 onSnapshot(collection(db,'products'),s=>{P=s.docs.map(d=>d.data()).sort((a,b)=>a.id-b.id);drawP()},er),
 onSnapshot(doc(db,'settings','store'),s=>{const d=s.data()||{};if(document.activeElement.closest('#t-settings'))return;$('#wa').value=d.wa||'';$('#mn').value=d.momoNumber||'';$('#mname').value=d.momoName||'';$('#mnet').value=d.momoNet||'MTN MoMo';$('#cod').checked=d.cod!==false;$('#pk').value=d.paystackKey||''},er),
 onSnapshot(collection(db,'orders'),s=>{if(!f1&&s.docChanges().some(c=>c.type==='added')){beep();toast('🛍 New order received')}f1=false;
  O=s.docs.map(d=>({_id:d.id,...d.data({serverTimestamps:'estimate'})})).sort((a,b)=>byT(b,a));drawO()},er),
 onSnapshot(collection(db,'chats'),s=>{if(!f2&&s.docChanges().some(c=>c.type!=='removed'&&c.doc.data().from==='c')){beep();toast('💬 New customer message')}f2=false;
  const c=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})})).sort((a,b)=>byT(b,a));
  $('#clist').innerHTML=c.length?c.map(x=>`<button class="ck cl ${x.from==='c'?'new':''}" data-chat="${x.id}"><span><b>${esc(x.name)}</b><br><small>${esc(x.last)}</small></span></button>`).join(''):'<p class="nc">No chats yet.</p>'},er)]}
function stop(){un.forEach(f=>f());un=[];uT&&uT();uT=null}
function drawO(){$('#st-o').textContent=O.filter(x=>x.status!=='confirmed').length;
 $('#olist').innerHTML=O.length?O.map(x=>`<div class="ord ${x.status==='confirmed'?'done':''}"><b>${esc(x.ref)}</b> · ${money(x.total)}<em>${x.status==='confirmed'?'Confirmed':'New'}</em><br>${esc(x.name)} · ${esc(x.phone)}<br><small>${esc(x.address)}${x.note?'<br>Note: '+esc(x.note):''}<br>${(x.items||[]).map(i=>i.qty+'× '+esc(i.name)).join(', ')}<br><b>Payment:</b> ${esc(x.pay||'—')}</small><div class="acts"><a class="btn o sm" target="_blank" rel="noopener" href="https://wa.me/${waNum(x.phone)}">WhatsApp customer</a>${x.status==='confirmed'?'':`<button class="btn sm" data-conf="${x._id}">Confirm &amp; reduce stock</button>`}</div></div>`).join(''):'<p class="nc">No orders yet.</p>'}
async function confirmO(id){const x=O.find(o=>o._id===id);if(!x)return;try{for(const i of x.items||[]){const p=P.find(q=>q.id===i.id);if(p)await updateDoc(doc(db,'products',String(p.id)),{stock:Math.max(0,p.stock-i.qty)})}await updateDoc(doc(db,'orders',id),{status:'confirmed'});toast('Order confirmed, stock updated')}catch(e){toast('Failed: '+(e.code||e.message))}}
function drawP(){$('#st-p').textContent=P.length;$('#st-l').textContent=P.filter(p=>p.stock<=5).length;
 $('#plist').innerHTML=P.length?P.map(p=>`<div class="admin-row"><div class="line" style="border:0;padding:0"><div class="t">${thumb(p)}</div></div><div class="m"><b>${esc(p.name)}</b><br>${money(p.price)} · ${esc(p.cat)}</div><input class="sq ${p.stock<=5?'low':''}" type="number" min="0" value="${p.stock}" data-sq="${p.id}" title="Stock"><button class="btn o sm" data-e="${p.id}">Edit</button><button class="btn o sm" data-del="${p.id}">✕</button></div>`).join(''):'<p class="nc">No products yet.</p>'}
function clr(){editId=null;img='';['pn','pp','pd','pr'].forEach(i=>$('#'+i).value='');$('#ps').value=10;$('#pc').value='Skincare';$('#pe').value='🧴';$('#pf').value='';$('#formT').textContent='Add product'}
function editP(id){const p=P.find(x=>x.id===id);if(!p)return;editId=id;$('#pn').value=p.name;$('#pp').value=p.price;$('#ps').value=p.stock;$('#pc').value=/deo/i.test(p.cat||'')?'Deodorants':'Skincare';$('#pe').value=p.emoji||'';$('#pd').value=p.desc||'';$('#pr').value=p.rating||'';img=p.img||'';$('#formT').textContent='Edit product';scrollTo({top:0,behavior:'smooth'})}
$('#clr').onclick=clr;
$('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.82);toast('Photo ready')};im.src=r.result};r.readAsDataURL(f)};
$('#save').onclick=async()=>{const name=$('#pn').value.trim(),price=parseFloat($('#pp').value);if(!name||isNaN(price))return toast('Name and price required');
 const id=editId||Date.now(),d={...(P.find(p=>p.id===id)||{}),id,name,price,stock:Math.max(0,parseInt($('#ps').value)||0),cat:$('#pc').value,emoji:$('#pe').value||'🧴',desc:$('#pd').value.trim(),img,rating:Math.min(5,Math.max(0,+$('#pr').value||0))};
 try{await setDoc(doc(db,'products',String(id)),d);toast(editId?'Product updated ✓':'Product added ✓');clr()}catch(e){toast('Could not save: '+(e.code||e.message))}};
$('#sset').onclick=async()=>{try{await setDoc(doc(db,'settings','store'),{wa:waNum($('#wa').value),momoNumber:$('#mn').value.trim(),momoName:$('#mname').value.trim(),momoNet:$('#mnet').value,cod:$('#cod').checked,paystackKey:$('#pk').value.trim()},{merge:true});toast('Settings saved ✓')}catch(e){toast('Not allowed: '+(e.code||''))}};
document.addEventListener('change',e=>{const id=e.target.dataset.sq;if(id)updateDoc(doc(db,'products',id),{stock:Math.max(0,parseInt(e.target.value)||0)}).then(()=>toast('Stock updated ✓')).catch(()=>toast('Could not update'))});
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;
 if(t.dataset.tab){document.querySelectorAll('.pan').forEach(x=>x.classList.toggle('on',x.id==='t-'+t.dataset.tab));document.querySelectorAll('.tabs .chip').forEach(x=>x.classList.toggle('on',x===t))}
 if(t.dataset.conf)confirmO(t.dataset.conf);
 if(t.dataset.e)editP(+t.dataset.e);
 if(t.dataset.del&&confirm('Delete this product?'))deleteDoc(doc(db,'products',t.dataset.del));
 if(t.dataset.chat)openThread(t.dataset.chat,t.querySelector('b').textContent)});
function openThread(id,name){curC=id;$('#thread').hidden=false;$('#tn').textContent=name;uT&&uT();
 uT=onSnapshot(collection(db,'chats',id,'messages'),s=>{$('#tmsgs').innerHTML=s.docs.map(d=>d.data({serverTimestamps:'estimate'})).sort(byT).map(m=>bub(m,m.from==='s')).join('');$('#tmsgs').scrollTop=1e9},er)}
async function reply(){const i=$('#rm'),text=i.value.trim();if(!text||!curC)return;i.value='';
 try{await addDoc(collection(db,'chats',curC,'messages'),{text,from:'s',t:serverTimestamp()});await setDoc(doc(db,'chats',curC),{last:'You: '+text,from:'s',t:serverTimestamp()},{merge:true})}catch(e){toast('Reply failed')}}
$('#rsend').onclick=reply;$('#rm').onkeydown=e=>{if(e.key==='Enter')reply()};
</script></body></html>
